name: Destroy

# Manual only. Destroys ONE environment. The job declares the chosen GitHub
# Environment, so prod needs its required-reviewer approval, and the apply
# role of that environment is the only one that can be assumed.
#
# The environment's CI roles (plan and apply) are deliberately NOT destroyed:
# the job runs as the apply role, and deleting its policy mid-run would cut off
# its own access to the state bucket. They cost nothing, so the next Terraform
# workflow run can re-create the environment with no local step.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options: [staging, prod]
        required: true
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true

permissions:
  contents: read

env:
  TF_VERSION: 1.15.9
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "confirm must equal the environment name (${{ inputs.environment }})."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -backend-config=envs/${{ inputs.environment }}.backend.hcl -input=false

      # Prod has deletion protection on the ALB and the database. Switch it off
      # first (only those two resources), then destroy.
      - name: Disable deletion protection
        run: |
          terraform apply -input=false -auto-approve -no-color -lock-timeout=60s \
            -var-file=envs/${{ inputs.environment }}.tfvars \
            -var alb_deletion_protection=false \
            -var db_deletion_protection=false \
            -target=module.ecs_service.aws_lb.this \
            -target=module.rds_postgres.aws_db_instance.this

      # Targets are the three modules plus the root security group rule that
      # joins them. Everything else in the root (the CI roles and their
      # policies) is left alone. Dependents of the targets are destroyed too.
      - name: Destroy (everything except the CI roles)
        run: |
          terraform destroy -input=false -auto-approve -no-color -lock-timeout=60s \
            -var-file=envs/${{ inputs.environment }}.tfvars \
            -var alb_deletion_protection=false \
            -var db_deletion_protection=false \
            -target=aws_vpc_security_group_egress_rule.service_to_db \
            -target=module.ecs_service \
            -target=module.rds_postgres \
            -target=module.network
